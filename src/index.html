<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Learnings</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Notes and findings from building with AI: LLMs, agents, and what actually ships.">
  <!--
    CSP via meta — primarily for GitHub Pages, which can't set HTTP headers.
    Netlify also sets a stricter CSP via headers (see netlify.toml); both apply on Netlify.
    'unsafe-inline' on style-src is required by Angular's component styles.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
