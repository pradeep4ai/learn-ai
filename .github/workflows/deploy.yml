name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Determine base-href
        id: base
        # If a CNAME file exists at the project root, deploy is on a custom domain → base-href is "/".
        # Otherwise default to "/<repo-name>/" for project pages.
        run: |
          if [ -f CNAME ] || [ -f public/CNAME ]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build -- --base-href "${{ steps.base.outputs.href }}"

      - name: SPA fallback (404 → index)
        run: cp dist/claude-blog/browser/index.html dist/claude-blog/browser/404.html

      - name: Disable Jekyll processing
        run: touch dist/claude-blog/browser/.nojekyll

      - name: Copy CNAME if present
        run: |
          if [ -f CNAME ]; then cp CNAME dist/claude-blog/browser/CNAME; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/claude-blog/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
